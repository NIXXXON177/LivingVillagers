plugins {
	id 'fabric-loom' version '1.12.7'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Здесь можно добавлять сторонние репозитории, если понадобятся другие моды-зависимости.
	// Loom уже сам добавляет репозитории Minecraft/Fabric.
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"livingvillagers" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// Версии смотри в gradle.properties
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API — почти всегда нужен, даём его сразу
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 21
}

java {
	// Loom автоматически прикрепит sourcesJar к задаче remapSourcesJar и к "build",
	// если этот блок присутствует. Удалишь строку — исходники в комплект не попадут.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

// Публикация не настроена — мод приватный, никуда не заливается (см. ТЗ, раздел 0).
